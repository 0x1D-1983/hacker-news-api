apiVersion: skaffold/v4beta13
kind: Config
metadata:
  name: hackernews-api
build:
  tagPolicy:
    inputDigest: {}
  artifacts:
    - image: hackernews-api
      context: HackerNews.Api
      docker:
        dockerfile: Dockerfile
  local:
    push: false
manifests:
  kustomize:
    paths:
      - k8s/api
      - k8s/edge
deploy:
  kubectl: {}
# Developer access to the API Service, bypassing the edge (so /health and /scalar are reachable too).
# The public edge is on localhost:8080 via the kind port mapping.
portForward:
  - resourceType: service
    resourceName: hackernews-api
    port: 80
    localPort: 8081
profiles:
  # API wired to the fake Hacker News, the k6-script ConfigMap, and a one-off k6 Job running load.js.
  - name: loadtest
    patches:
      - op: replace
        path: /manifests/kustomize/paths
        value:
          - k8s/loadtest
          - k8s/k6
      - op: add
        path: /manifests/rawYaml
        value:
          - k8s/k6.yaml
