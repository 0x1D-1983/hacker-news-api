# Single-node kind cluster: the control-plane node runs the API and the edge Envoy.
# The edge Service's NodePort is published on the host as localhost:8080.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: hackernews
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        listenAddress: 127.0.0.1
        protocol: TCP
