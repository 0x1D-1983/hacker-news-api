apiVersion: v1
kind: Service
metadata:
  name: hackernews-api
spec:
  selector:
    app: hackernews-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hackernews-api
spec:
  # Each replica keeps its own in-memory cache and polls Hacker News on its own schedule.
  replicas: 1
  selector:
    matchLabels:
      app: hackernews-api
  template:
    metadata:
      labels:
        app: hackernews-api
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: api
          image: hackernews-api
          ports:
            - name: http
              containerPort: 8080
          env:
            # No OTLP collector runs in this cluster; point this at one to export traces and metrics.
            - name: Telemetry__Enabled
              value: "false"
            # kind's pod network. Trust X-Forwarded-For from it; the NetworkPolicy below makes sure
            # only the edge Envoy pods can actually connect.
            - name: TrustedProxies__Networks__0
              value: 10.244.0.0/16
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # Probes call the pod IP directly, so /health* works even though the edge proxy doesn't route it.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
---
# Only the edge Envoy may connect to the API, so trusting X-Forwarded-For from the pod network
# means trusting Envoy alone. Kubelet probes and kubectl port-forward come from the node, not a pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hackernews-api
spec:
  podSelector:
    matchLabels:
      app: hackernews-api
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: edge-envoy
      ports:
        - port: http
