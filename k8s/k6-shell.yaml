apiVersion: v1
kind: Pod
metadata:
  name: k6-shell
  labels:
    app: k6-shell
spec:
  nodeSelector:
    hackernews.io/pool: loadtest
  tolerations:
    - key: hackernews.io/pool
      operator: Equal
      value: loadtest
      effect: NoSchedule
  terminationGracePeriodSeconds: 1
  containers:
    - name: k6
      image: grafana/k6:2.3.0
      command: ["sleep", "infinity"]
      workingDir: /scripts
      env:
        - name: BASE_URL
          value: http://edge
        - name: UPSTREAM_URL
          value: http://fake-hackernews:8080
      resources:
        requests:
          cpu: "2"
          memory: 2Gi
        limits:
          cpu: "3"
          memory: 6Gi
      volumeMounts:
        - name: script
          mountPath: /scripts
  volumes:
    - name: script
      configMap:
        name: k6-script
