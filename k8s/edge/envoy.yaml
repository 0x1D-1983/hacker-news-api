# Edge proxy: routes /api/* to the API Service and answers everything else with 404.
admin:
  # Localhost only: stats and config dumps are not exposed outside the pod.
  address:
    socket_address: { address: 127.0.0.1, port_value: 9901 }
static_resources:
  listeners:
    - name: http
      address:
        socket_address: { address: 0.0.0.0, port_value: 8080 }
      per_connection_buffer_limit_bytes: 32768
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: edge
                use_remote_address: true
                # Normalise before routing so /api/../health or /api/%2F.. can't reach unrouted paths.
                normalize_path: true
                merge_slashes: true
                path_with_escaped_slashes_action: REJECT_REQUEST
                request_headers_timeout: 10s
                stream_idle_timeout: 30s
                common_http_protocol_options:
                  idle_timeout: 60s
                  headers_with_underscores_action: REJECT_REQUEST
                route_config:
                  name: edge
                  virtual_hosts:
                    - name: hackernews
                      domains: ["*"]
                      routes:
                        - match: { path_separated_prefix: /api }
                          route:
                            cluster: hackernews_api
                            timeout: 15s
                            # The API is read-only, so retrying is safe; covers pooled connections
                            # to a pod that is shutting down during a rollout.
                            retry_policy:
                              retry_on: connect-failure,refused-stream,reset
                              num_retries: 2
                        - match: { prefix: / }
                          direct_response: { status: 404 }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: hackernews_api
      type: STRICT_DNS
      connect_timeout: 2s
      load_assignment:
        cluster_name: hackernews_api
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: hackernews-api.default.svc.cluster.local, port_value: 80 }
